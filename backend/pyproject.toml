[project]
name = "workboard-api"
version = "0.1.0"
description = "Authenticated workboard API for the DevOps Project 1 laboratory"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.14,<2",
    "email-validator>=2.2,<3",
    "fastapi[standard]>=0.115,<1",
    "pwdlib[argon2]>=0.2,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.10,<3",
    "sqlalchemy>=2.0,<2.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov=alembic --cov-branch --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
relative_files = true

[tool.coverage.report]
precision = 2

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
